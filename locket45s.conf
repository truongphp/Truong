[General]
update-url = https://github.com/truongphp/Truong/blob/main/locket45s.conf

[Script]
# RevenueCat - script hiện tại
locket_revenuecat = type=http-response, pattern=^https:\/\/api\.revenuecat\.com\/.+\/(receipts|subscribers), script-path=https://raw.githubusercontent.com/truongphp/Truong/refs/heads/main/locketgold.js, requires-body=true, max-size=-1, timeout=60

# Xóa header cache
locket_delete_header = type=http-request, pattern=^https:\/\/(api\.revenuecat\.com|firebaseremoteconfig\.googleapis\.com)\/.+, script-path=https://raw.githubusercontent.com/truongphp/Truong/refs/heads/main/dklocket.js, timeout=60

# Firebase Remote Config
locket_unlocked = type=http-response, pattern=^https:\/\/firebaseremoteconfig\.googleapis\.com\/.+, script-path=https://raw.githubusercontent.com/truongphp/Truong/refs/heads/main/caption.js, requires-body=true, max-size=-1, timeout=60

[MITM]
ca-passphrase = 
ca-p12 = 
enable = true
hostname = %APPEND% api.locketcamera.com, firebaseremoteconfig.googleapis.com, api.revenuecat.com
