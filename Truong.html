<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Galaxy of Love ✨ Vũ Trụ Tình Yêu</title>
  <meta name="theme-color" content="#030108">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,300;0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #030108;
      font-family: 'Montserrat', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: #ffffff;
      touch-action: none;
    }

    #webgl-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      display: block;
    }

    /* Vòng tròn hướng dẫn chạm vào quả cầu / trái tim ở Màn 1 */
    .target-guide {
      position: fixed;
      top: 59%;
      left: 62%;
      transform: translate(-50%, -50%);
      pointer-events: auto;
      cursor: pointer;
      width: 80px;
      height: 80px;
      z-index: 15;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: opacity 0.6s ease, transform 0.6s ease;
    }

    .pulse-ring-outer {
      position: absolute;
      width: 72px;
      height: 72px;
      border-radius: 50%;
      border: 2px dashed rgba(255, 255, 255, 0.85);
      animation: rotateRing 8s linear infinite;
    }

    .pulse-ring-inner {
      position: absolute;
      width: 54px;
      height: 54px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(244, 114, 182, 0.4) 0%, rgba(255, 255, 255, 0.1) 70%, transparent 100%);
      border: 1.5px solid rgba(255, 255, 255, 0.95);
      box-shadow: 0 0 20px rgba(244, 114, 182, 0.8), inset 0 0 12px rgba(255, 255, 255, 0.6);
      animation: pulseRipple 1.8s ease-in-out infinite;
    }

    .pointer-arrow {
      position: absolute;
      bottom: -4px;
      right: -4px;
      width: 26px;
      height: 26px;
      filter: drop-shadow(0 3px 8px rgba(0, 0, 0, 0.8));
      animation: bouncePointer 1.4s ease-in-out infinite;
      z-index: 2;
    }

    @keyframes rotateRing {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    @keyframes pulseRipple {
      0%, 100% {
        transform: scale(0.9);
        opacity: 0.95;
      }
      50% {
        transform: scale(1.18);
        opacity: 0.55;
      }
    }

    @keyframes bouncePointer {
      0%, 100% { transform: translate(0, 0); }
      50% { transform: translate(-6px, -6px); }
    }

    /* Hiệu ứng trái tim bay lơ lửng khi chạm màn hình */
    .tap-heart-fx {
      position: fixed;
      pointer-events: none;
      font-size: 26px;
      animation: floatHeart 1.3s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
      z-index: 99;
      filter: drop-shadow(0 0 10px rgba(244, 114, 182, 0.8));
    }

    @keyframes floatHeart {
      0% {
        transform: translate(-50%, -50%) scale(0.4) rotate(0deg);
        opacity: 1;
      }
      50% {
        transform: translate(-50%, -90px) scale(1.3) rotate(-15deg);
        opacity: 0.95;
      }
      100% {
        transform: translate(-50%, -160px) scale(0.9) rotate(20deg);
        opacity: 0;
      }
    }
  </style>

  <!-- Three.js CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

  <canvas id="webgl-canvas"></canvas>

  <!-- File nhạc nền .mp3 (Đặt file music.mp3 cùng thư mục hoặc đổi đường dẫn tại src) -->
  <audio id="bg-music" src="music.mp3" loop preload="auto" playsinline></audio>

  <!-- Vòng tròn chỉ dẫn chạm vào trái tim / quả cầu -->
  <div class="target-guide" id="targetGuide" title="Chạm vào quả cầu">
    <div class="pulse-ring-outer"></div>
    <div class="pulse-ring-inner"></div>
    <svg class="pointer-arrow" viewBox="0 0 24 24" fill="#ffffff">
      <path d="M7 2l12 11.2-5.8.5 3.3 7.3-2.5 1.1-3.3-7.4-4.7 4.3V2z"/>
    </svg>
  </div>

  <script>
    /* ============================================================
       1. HỆ THỐNG ÂM NHẠC NỀN (.MP3)
          Chỉ sử dụng file nhạc .mp3 thông qua thẻ <audio id="bg-music">
       ============================================================ */
    const bgMusic = document.getElementById('bg-music');
    let isAttemptingPlay = false;

    if (bgMusic) {
      bgMusic.volume = 0.85;
    }

    function startRomanticMusic() {
      if (!bgMusic || !bgMusic.paused || isAttemptingPlay) return;

      isAttemptingPlay = true;
      const playPromise = bgMusic.play();

      if (playPromise !== undefined) {
        playPromise
          .then(() => {
            isAttemptingPlay = false;
          })
          .catch(() => {
            // Chờ thao tác chạm hợp lệ tiếp theo nếu trình duyệt chặn tự phát
            isAttemptingPlay = false;
          });
      } else {
        isAttemptingPlay = false;
      }
    }

    // Tự động phát nhạc .mp3 ngay ở thao tác chạm đầu tiên trên màn hình
    window.addEventListener('click', startRomanticMusic, { passive: true });
    window.addEventListener('touchend', startRomanticMusic, { passive: true });
    window.addEventListener('touchstart', startRomanticMusic, { passive: true });

    /* ============================================================
       2. CẤU TRÚC THREE.JS & BỘ ĐIỀU KHIỂN XOAY 360
       ============================================================ */
    let scene, camera, renderer;
    let planetGroup, planetMesh, atmoMesh, ringMesh;
    let galaxyPoints, galaxyGeometry, galaxyMaterial;
    let bgStarsPoints, nebulaCloudsGroup;
    let ringCanvas, ringCtx, ringTexture;

    let currentMode = 'closeup';
    let isTransitioning = false;
    let transitionProgress = 0.0;

    let textOnRing = "I LOVE YOU 💖 ";

    const orbit = {
      radius: 4.3,
      targetRadius: 4.3,
      theta: 0.0,
      phi: Math.PI / 2.1,
      targetTheta: 0.0,
      targetPhi: Math.PI / 2.1,
      isDragging: false,
      prevX: 0,
      prevY: 0,
      touchStartDist: 0,
      autoRotate: true,
      autoRotateSpeed: 0.002
    };

    function init3D() {
      const canvasEl = document.getElementById('webgl-canvas');

      scene = new THREE.Scene();
      scene.fog = new THREE.FogExp2(0x030108, 0.0075);

      camera = new THREE.PerspectiveCamera(
        45,
        window.innerWidth / window.innerHeight,
        0.1,
        1200
      );
      updateCameraPosition();

      renderer = new THREE.WebGLRenderer({
        canvas: canvasEl,
        antialias: true,
        alpha: false,
        powerPreference: "high-performance"
      });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2.0));
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.2;

      const ambientLight = new THREE.AmbientLight(0xffffff, 0.85);
      scene.add(ambientLight);

      const centralPointLight = new THREE.PointLight(0xffaacc, 3.2, 40);
      centralPointLight.position.set(0, 0, 0);
      scene.add(centralPointLight);

      const keyLight = new THREE.DirectionalLight(0xffffff, 1.4);
      keyLight.position.set(6, 8, 7);
      scene.add(keyLight);

      const rimPinkLight = new THREE.PointLight(0xf472b6, 3.5, 25);
      rimPinkLight.position.set(-5, -2, 4);
      scene.add(rimPinkLight);

      createSkyStars();
      createNebulaGasClouds();
      createPlanetCluster();
      createSpiralGalaxyField();

      setupOrbitEvents(canvasEl);
      setupUIEvents();
      window.addEventListener('resize', handleWindowResize);
    }

    function updateCameraPosition() {
      const sinPhi = Math.sin(orbit.phi);
      camera.position.x = orbit.radius * sinPhi * Math.sin(orbit.theta);
      camera.position.y = orbit.radius * Math.cos(orbit.phi);
      camera.position.z = orbit.radius * sinPhi * Math.cos(orbit.theta);
      camera.lookAt(0, 0, 0);
    }

    /* ============================================================
       3. TẠO QUẢ CẦU 3D & VÀNH ĐAI I LOVE YOU
       ============================================================ */
    function generateHolographicTexture() {
      const size = 1024;
      const c = document.createElement('canvas');
      c.width = size;
      c.height = size / 2;
      const ctx = c.getContext('2d');

      const grad = ctx.createLinearGradient(0, 0, size, size / 2);
      grad.addColorStop(0.0, '#f9a8d4');
      grad.addColorStop(0.2, '#c084fc');
      grad.addColorStop(0.4, '#fbcfe8');
      grad.addColorStop(0.65, '#f472b6');
      grad.addColorStop(0.85, '#e9d5ff');
      grad.addColorStop(1.0, '#fef08a');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, size, size / 2);

      for (let i = 0; i < 20; i++) {
        ctx.beginPath();
        const yBase = (i / 20) * (size / 2) + Math.sin(i) * 20;
        ctx.moveTo(0, yBase);
        for (let x = 0; x <= size; x += 30) {
          const wave = Math.sin(x * 0.012 + i * 1.6) * 40 + Math.cos(x * 0.006 + i) * 25;
          ctx.lineTo(x, yBase + wave);
        }
        ctx.lineTo(size, size / 2);
        ctx.lineTo(0, size / 2);
        ctx.closePath();

        const ribbonColors = [
          'rgba(244, 114, 182, 0.35)',
          'rgba(168, 85, 247, 0.28)',
          'rgba(253, 224, 71, 0.22)',
          'rgba(147, 197, 253, 0.25)',
          'rgba(251, 113, 133, 0.28)'
        ];
        ctx.fillStyle = ribbonColors[i % ribbonColors.length];
        ctx.fill();
      }

      const highlight = ctx.createRadialGradient(size * 0.42, size * 0.22, 20, size * 0.42, size * 0.22, size * 0.38);
      highlight.addColorStop(0, 'rgba(255, 255, 255, 0.75)');
      highlight.addColorStop(0.4, 'rgba(255, 255, 255, 0.2)');
      highlight.addColorStop(1, 'rgba(255, 255, 255, 0)');
      ctx.fillStyle = highlight;
      ctx.fillRect(0, 0, size, size / 2);

      const texture = new THREE.CanvasTexture(c);
      texture.wrapS = THREE.RepeatWrapping;
      texture.wrapT = THREE.ClampToEdgeWrapping;
      return texture;
    }

    function createPlanetCluster() {
      planetGroup = new THREE.Group();
      planetGroup.rotation.z = 0.22;

      const sphereGeom = new THREE.SphereGeometry(1.28, 64, 64);
      const sphereTex = generateHolographicTexture();

      const sphereMat = new THREE.MeshStandardMaterial({
        map: sphereTex,
        roughness: 0.22,
        metalness: 0.18,
        emissive: 0x4a1d48,
        emissiveIntensity: 0.4
      });
      planetMesh = new THREE.Mesh(sphereGeom, sphereMat);
      planetGroup.add(planetMesh);

      const atmoGeom = new THREE.SphereGeometry(1.36, 48, 48);
      const atmoMat = new THREE.ShaderMaterial({
        vertexShader: `
          varying vec3 vNormal;
          varying vec3 vPosition;
          void main() {
            vNormal = normalize(normalMatrix * normal);
            vPosition = (modelViewMatrix * vec4(position, 1.0)).xyz;
            gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
          }
        `,
        fragmentShader: `
          varying vec3 vNormal;
          varying vec3 vPosition;
          void main() {
            vec3 viewDir = normalize(-vPosition);
            float rim = pow(1.0 - max(dot(viewDir, vNormal), 0.0), 2.2);
            vec3 glowCol = mix(vec3(0.96, 0.45, 0.75), vec3(0.85, 0.75, 1.0), rim);
            gl_FragColor = vec4(glowCol, rim * 0.72);
          }
        `,
        blending: THREE.AdditiveBlending,
        side: THREE.BackSide,
        transparent: true
      });
      atmoMesh = new THREE.Mesh(atmoGeom, atmoMat);
      planetGroup.add(atmoMesh);

      createRingBelt();
      scene.add(planetGroup);
    }

    function updateRingTextureContent() {
      if (!ringCanvas) {
        ringCanvas = document.createElement('canvas');
        ringCanvas.width = 2048;
        ringCanvas.height = 128;
        ringCtx = ringCanvas.getContext('2d');
      }

      ringCtx.clearRect(0, 0, ringCanvas.width, ringCanvas.height);

      const ribbonGrad = ringCtx.createLinearGradient(0, 0, 0, ringCanvas.height);
      ribbonGrad.addColorStop(0, 'rgba(255, 255, 255, 0)');
      ribbonGrad.addColorStop(0.3, 'rgba(255, 230, 245, 0.3)');
      ribbonGrad.addColorStop(0.5, 'rgba(255, 255, 255, 0.65)');
      ribbonGrad.addColorStop(0.7, 'rgba(255, 210, 240, 0.3)');
      ribbonGrad.addColorStop(1, 'rgba(255, 255, 255, 0)');
      ringCtx.fillStyle = ribbonGrad;
      ringCtx.fillRect(0, 0, ringCanvas.width, ringCanvas.height);

      ringCtx.font = 'bold 44px "Montserrat", sans-serif';
      ringCtx.textBaseline = 'middle';
      ringCtx.textAlign = 'left';

      const phrase = textOnRing.trim() + "   ";
      const wText = Math.max(ringCtx.measureText(phrase).width, 100);
      const count = Math.ceil(ringCanvas.width / wText) + 2;

      for (let i = 0; i < count; i++) {
        const x = i * wText;
        ringCtx.shadowColor = '#ec4899';
        ringCtx.shadowBlur = 15;
        ringCtx.fillStyle = '#ffffff';
        ringCtx.fillText(phrase, x, ringCanvas.height / 2);

        ringCtx.shadowBlur = 0;
        ringCtx.fillStyle = '#fff5fa';
        ringCtx.fillText(phrase, x, ringCanvas.height / 2);
      }

      if (ringTexture) {
        ringTexture.needsUpdate = true;
      }
    }

    function createRingBelt() {
      updateRingTextureContent();

      ringTexture = new THREE.CanvasTexture(ringCanvas);
      ringTexture.wrapS = THREE.RepeatWrapping;
      ringTexture.wrapT = THREE.ClampToEdgeWrapping;

      const ringGeom = new THREE.CylinderGeometry(1.88, 1.92, 0.32, 96, 1, true);
      const ringMat = new THREE.MeshBasicMaterial({
        map: ringTexture,
        side: THREE.DoubleSide,
        transparent: true,
        opacity: 0.95,
        blending: THREE.AdditiveBlending,
        depthWrite: false
      });

      ringMesh = new THREE.Mesh(ringGeom, ringMat);
      ringMesh.rotation.x = Math.PI / 2.75;
      ringMesh.rotation.y = 0.22;
      planetGroup.add(ringMesh);
    }

    /* ============================================================
       4. TẠO DẢI NGÂN HÀ XOẮN ỐC & TINH VÂN RỰC RỠ
       ============================================================ */
    function generateParticleSprite() {
      const c = document.createElement('canvas');
      c.width = 64;
      c.height = 64;
      const ctx = c.getContext('2d');

      const rad = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);
      rad.addColorStop(0, 'rgba(255, 255, 255, 1)');
      rad.addColorStop(0.25, 'rgba(255, 235, 245, 0.85)');
      rad.addColorStop(0.55, 'rgba(236, 72, 153, 0.45)');
      rad.addColorStop(0.85, 'rgba(192, 132, 252, 0.15)');
      rad.addColorStop(1, 'rgba(0, 0, 0, 0)');

      ctx.fillStyle = rad;
      ctx.fillRect(0, 0, 64, 64);
      return new THREE.CanvasTexture(c);
    }

    function createSpiralGalaxyField() {
      const numParticles = 45000;
      const positions = new Float32Array(numParticles * 3);
      const colors = new Float32Array(numParticles * 3);
      const scales = new Float32Array(numParticles);

      const numArms = 3;
      const maxRadius = 17.5;
      const spinAngle = 1.32;

      const colorCore = new THREE.Color(0xffffff);
      const colorMid = new THREE.Color(0xfbcfe8);
      const colorPurple = new THREE.Color(0xc084fc);
      const colorCyan = new THREE.Color(0xa5f3fc);
      const colorOuter = new THREE.Color(0xf472b6);

      for (let i = 0; i < numParticles; i++) {
        const r = Math.pow(Math.random(), 1.65) * maxRadius + 1.45;
        const armOffset = ((i % numArms) * (2 * Math.PI)) / numArms;
        const curve = r * spinAngle;

        const spread = Math.pow(r / maxRadius, 1.25) * 1.65;
        const randX = (Math.random() - 0.5) * spread;
        const randY = (Math.random() - 0.5) * (spread * 0.7);
        const randZ = (Math.random() - 0.5) * spread;

        positions[i * 3] = Math.cos(armOffset + curve) * r + randX;
        positions[i * 3 + 1] = randY;
        positions[i * 3 + 2] = Math.sin(armOffset + curve) * r + randZ;

        const ratio = (r - 1.45) / maxRadius;
        let c = colorCore.clone();
        if (ratio < 0.25) {
          c.lerp(colorMid, ratio / 0.25);
        } else if (ratio < 0.6) {
          const branchColor = (i % 2 === 0) ? colorPurple : colorCyan;
          c = colorMid.clone().lerp(branchColor, (ratio - 0.25) / 0.35);
        } else {
          c = colorPurple.clone().lerp(colorOuter, (ratio - 0.6) / 0.4);
        }

        colors[i * 3] = c.r;
        colors[i * 3 + 1] = c.g;
        colors[i * 3 + 2] = c.b;

        scales[i] = Math.random() * 0.8 + 0.3;
      }

      galaxyGeometry = new THREE.BufferGeometry();
      galaxyGeometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
      galaxyGeometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
      galaxyGeometry.setAttribute('scale', new THREE.BufferAttribute(scales, 1));

      galaxyMaterial = new THREE.PointsMaterial({
        size: 0.34,
        map: generateParticleSprite(),
        vertexColors: true,
        transparent: true,
        opacity: 0.0,
        blending: THREE.AdditiveBlending,
        depthWrite: false,
        sizeAttenuation: true
      });

      galaxyPoints = new THREE.Points(galaxyGeometry, galaxyMaterial);
      galaxyPoints.rotation.x = Math.PI / 4.1;
      galaxyPoints.rotation.z = -0.22;
      scene.add(galaxyPoints);
    }

    function createNebulaGasClouds() {
      nebulaCloudsGroup = new THREE.Group();

      const nebulaSpecs = [
        { x: -5.8, y: 7.2, z: -8.5, color: '#34d399', radius: 10.5, maxOpacity: 0.32 },
        { x: 7.0, y: 8.2, z: -10.0, color: '#c084fc', radius: 12.5, maxOpacity: 0.35 },
        { x: 7.5, y: 1.2, z: -7.0, color: '#fde047', radius: 11.0, maxOpacity: 0.28 },
        { x: -7.2, y: -6.5, z: -9.5, color: '#f43f5e', radius: 13.0, maxOpacity: 0.32 },
        { x: 0, y: 1.0, z: -5.0, color: '#fbcfe8', radius: 8.5, maxOpacity: 0.38 }
      ];

      nebulaSpecs.forEach(spec => {
        const c = document.createElement('canvas');
        c.width = 256;
        c.height = 256;
        const ctx = c.getContext('2d');

        const g = ctx.createRadialGradient(128, 128, 0, 128, 128, 128);
        g.addColorStop(0, spec.color);
        g.addColorStop(0.35, spec.color);
        g.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.fillStyle = g;
        ctx.fillRect(0, 0, 256, 256);

        const tex = new THREE.CanvasTexture(c);
        const mat = new THREE.SpriteMaterial({
          map: tex,
          transparent: true,
          opacity: 0.0,
          blending: THREE.AdditiveBlending,
          depthWrite: false
        });

        const sprite = new THREE.Sprite(mat);
        sprite.position.set(spec.x, spec.y, spec.z);
        sprite.scale.set(spec.radius * 2, spec.radius * 2, 1);
        sprite.userData = { maxOpacity: spec.maxOpacity };

        nebulaCloudsGroup.add(sprite);
      });

      scene.add(nebulaCloudsGroup);
    }

    function createSkyStars() {
      const starCount = 3800;
      const positions = new Float32Array(starCount * 3);
      const colors = new Float32Array(starCount * 3);

      for (let i = 0; i < starCount; i++) {
        const u = Math.random();
        const v = Math.random();
        const theta = u * 2.0 * Math.PI;
        const phi = Math.acos(2.0 * v - 1.0);
        const dist = 140 + Math.random() * 80;

        positions[i * 3] = dist * Math.sin(phi) * Math.cos(theta);
        positions[i * 3 + 1] = dist * Math.sin(phi) * Math.sin(theta);
        positions[i * 3 + 2] = dist * Math.cos(phi);

        const tint = Math.random();
        if (tint < 0.65) {
          colors[i * 3] = 1; colors[i * 3 + 1] = 1; colors[i * 3 + 2] = 1;
        } else if (tint < 0.85) {
          colors[i * 3] = 0.98; colors[i * 3 + 1] = 0.68; colors[i * 3 + 2] = 0.88;
        } else {
          colors[i * 3] = 0.82; colors[i * 3 + 1] = 0.75; colors[i * 3 + 2] = 1.0;
        }
      }

      const geom = new THREE.BufferGeometry();
      geom.setAttribute('position', new THREE.BufferAttribute(positions, 3));
      geom.setAttribute('color', new THREE.BufferAttribute(colors, 3));

      const mat = new THREE.PointsMaterial({
        size: 0.9,
        vertexColors: true,
        transparent: true,
        opacity: 0.9
      });

      bgStarsPoints = new THREE.Points(geom, mat);
      scene.add(bgStarsPoints);
    }

    /* ============================================================
       5. CHUYỂN CẢNH MƯỢT MÀ KHI ẤN VÀO QUẢ CẦU
       ============================================================ */
    function switchDisplayMode(targetMode, duration = 1800) {
      if (isTransitioning) return;
      isTransitioning = true;
      currentMode = targetMode;

      // Bật nhạc .mp3 ngay khi chuyển cảnh
      startRomanticMusic();

      const startProgress = transitionProgress;
      const endProgress = targetMode === 'galaxy' ? 1.0 : 0.0;
      const startTime = performance.now();

      const targetGuide = document.getElementById('targetGuide');

      if (targetMode === 'galaxy') {
        targetGuide.style.opacity = '0';
        targetGuide.style.pointerEvents = 'none';
      } else {
        setTimeout(() => {
          targetGuide.style.opacity = '1';
          targetGuide.style.pointerEvents = 'auto';
        }, 500);
      }

      const startRad = orbit.radius;
      const endRad = targetMode === 'galaxy' ? 19.5 : 4.3;

      const startPhi = orbit.phi;
      const endPhi = targetMode === 'galaxy' ? Math.PI / 2.7 : Math.PI / 2.1;

      function renderFrame(now) {
        const elapsed = now - startTime;
        const t = Math.min(elapsed / duration, 1.0);
        const ease = t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;

        transitionProgress = THREE.MathUtils.lerp(startProgress, endProgress, ease);
        orbit.targetRadius = THREE.MathUtils.lerp(startRad, endRad, ease);
        orbit.targetPhi = THREE.MathUtils.lerp(startPhi, endPhi, ease);

        if (galaxyMaterial) {
          galaxyMaterial.opacity = transitionProgress * 0.95;
          const scale = 0.2 + transitionProgress * 0.8;
          galaxyPoints.scale.set(scale, scale, scale);
        }

        if (nebulaCloudsGroup) {
          nebulaCloudsGroup.children.forEach(sprite => {
            sprite.material.opacity = sprite.userData.maxOpacity * transitionProgress;
          });
        }

        if (planetMesh) {
          planetMesh.material.emissiveIntensity = 0.4 + transitionProgress * 0.7;
        }

        if (t < 1.0) {
          requestAnimationFrame(renderFrame);
        } else {
          isTransitioning = false;
        }
      }

      requestAnimationFrame(renderFrame);
    }

    /* ============================================================
       6. ĐIỀU KHIỂN CHUỘT / CẢM ỨNG DI ĐỘNG (XOAY 360 ĐỘ & ZOOM)
       ============================================================ */
    function setupOrbitEvents(el) {
      el.addEventListener('mousedown', (e) => {
        orbit.isDragging = true;
        orbit.prevX = e.clientX;
        orbit.prevY = e.clientY;
      });

      window.addEventListener('mousemove', (e) => {
        if (!orbit.isDragging) return;
        const deltaX = e.clientX - orbit.prevX;
        const deltaY = e.clientY - orbit.prevY;
        orbit.prevX = e.clientX;
        orbit.prevY = e.clientY;

        orbit.targetTheta -= deltaX * 0.006;
        orbit.targetPhi -= deltaY * 0.006;
        orbit.targetPhi = Math.max(0.1, Math.min(Math.PI - 0.1, orbit.targetPhi));
      });

      window.addEventListener('mouseup', () => {
        orbit.isDragging = false;
      });

      el.addEventListener('wheel', (e) => {
        e.preventDefault();
        const zoomDelta = e.deltaY * 0.015;
        const minR = (currentMode === 'galaxy') ? 3.5 : 2.5;
        const maxR = (currentMode === 'galaxy') ? 45.0 : 7.0;
        orbit.targetRadius = Math.max(minR, Math.min(maxR, orbit.targetRadius + zoomDelta));
      }, { passive: false });

      el.addEventListener('touchstart', (e) => {
        if (e.touches.length === 1) {
          orbit.isDragging = true;
          orbit.prevX = e.touches[0].clientX;
          orbit.prevY = e.touches[0].clientY;
        } else if (e.touches.length === 2) {
          orbit.isDragging = false;
          const dx = e.touches[0].clientX - e.touches[1].clientX;
          const dy = e.touches[0].clientY - e.touches[1].clientY;
          orbit.touchStartDist = Math.hypot(dx, dy);
        }
      }, { passive: true });

      el.addEventListener('touchmove', (e) => {
        if (e.touches.length === 1 && orbit.isDragging) {
          const deltaX = e.touches[0].clientX - orbit.prevX;
          const deltaY = e.touches[0].clientY - orbit.prevY;
          orbit.prevX = e.touches[0].clientX;
          orbit.prevY = e.touches[0].clientY;

          orbit.targetTheta -= deltaX * 0.007;
          orbit.targetPhi -= deltaY * 0.007;
          orbit.targetPhi = Math.max(0.1, Math.min(Math.PI - 0.1, orbit.targetPhi));
        } else if (e.touches.length === 2) {
          const dx = e.touches[0].clientX - e.touches[1].clientX;
          const dy = e.touches[0].clientY - e.touches[1].clientY;
          const currentDist = Math.hypot(dx, dy);
          const diff = (orbit.touchStartDist - currentDist) * 0.04;
          orbit.touchStartDist = currentDist;

          const minR = (currentMode === 'galaxy') ? 3.5 : 2.5;
          const maxR = (currentMode === 'galaxy') ? 45.0 : 7.0;
          orbit.targetRadius = Math.max(minR, Math.min(maxR, orbit.targetRadius + diff));
        }
      }, { passive: true });

      el.addEventListener('touchend', () => {
        orbit.isDragging = false;
      });
    }

    /* ============================================================
       7. HIỆU ỨNG TRÁI TIM & CHẠM QUẢ CẦU
       ============================================================ */
    function triggerFloatingHeartFx(x, y) {
      const heartEl = document.createElement('div');
      heartEl.className = 'tap-heart-fx';
      const symbols = ['💖', '💕', '✨', '💗', '⭐', '🌸'];
      heartEl.textContent = symbols[Math.floor(Math.random() * symbols.length)];
      heartEl.style.left = `${x}px`;
      heartEl.style.top = `${y}px`;
      document.body.appendChild(heartEl);

      setTimeout(() => {
        heartEl.remove();
      }, 1300);
    }

    function setupUIEvents() {
      const targetGuide = document.getElementById('targetGuide');

      targetGuide.addEventListener('click', (e) => {
        e.stopPropagation();
        startRomanticMusic();
        triggerFloatingHeartFx(e.clientX, e.clientY);
        switchDisplayMode('galaxy');
      });

      const raycaster = new THREE.Raycaster();
      const mouseVec = new THREE.Vector2();

      window.addEventListener('pointerdown', (e) => {
        startRomanticMusic();
        triggerFloatingHeartFx(e.clientX, e.clientY);

        if (currentMode === 'closeup' && !isTransitioning) {
          mouseVec.x = (e.clientX / window.innerWidth) * 2 - 1;
          mouseVec.y = -(e.clientY / window.innerHeight) * 2 + 1;
          raycaster.setFromCamera(mouseVec, camera);

          const hits = raycaster.intersectObjects([planetMesh, ringMesh, atmoMesh]);
          if (hits.length > 0) {
            switchDisplayMode('galaxy');
          }
        }
      });
    }

    function handleWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    /* ============================================================
       8. VÒNG LẶP RENDER HOẠT ẢNH
       ============================================================ */
    const animClock = new THREE.Clock();

    function renderLoop() {
      requestAnimationFrame(renderLoop);

      const delta = animClock.getDelta();
      const elapsed = animClock.getElapsedTime();

      if (!orbit.isDragging) {
        orbit.targetTheta += orbit.autoRotateSpeed;
      }

      orbit.theta += (orbit.targetTheta - orbit.theta) * 0.08;
      orbit.phi += (orbit.targetPhi - orbit.phi) * 0.08;
      orbit.radius += (orbit.targetRadius - orbit.radius) * 0.08;
      updateCameraPosition();

      if (planetMesh) {
        planetMesh.rotation.y += delta * 0.16;
      }

      if (ringMesh) {
        ringMesh.rotation.z -= delta * 0.08;
        if (ringTexture) {
          ringTexture.offset.x -= delta * 0.055;
        }
      }

      if (galaxyPoints && galaxyMaterial.opacity > 0.02) {
        galaxyPoints.rotation.y += delta * 0.038;

        const scalesArr = galaxyGeometry.attributes.scale.array;
        for (let i = 0; i < scalesArr.length; i += 35) {
          scalesArr[i] = 0.32 + 0.32 * Math.sin(elapsed * 2.8 + i);
        }
        galaxyGeometry.attributes.scale.needsUpdate = true;
      }

      if (bgStarsPoints) {
        bgStarsPoints.rotation.y += delta * 0.007;
      }

      if (nebulaCloudsGroup && transitionProgress > 0.05) {
        nebulaCloudsGroup.children.forEach((sprite, idx) => {
          const breath = 1.0 + 0.075 * Math.sin(elapsed * 1.6 + idx * 1.2);
          const rBase = 10.5 + idx * 1.4;
          sprite.scale.set(rBase * breath * 2, rBase * breath * 2, 1);
        });
      }

      renderer.render(scene, camera);
    }

    window.addEventListener('DOMContentLoaded', () => {
      init3D();
      renderLoop();
    });
  </script>
</body>
